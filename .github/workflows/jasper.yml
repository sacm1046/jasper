name: Jasper Workflow

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Archivo .jrxml a compilar'
        required: true
        type: string
        default: CONTRATO_GNRAL_FMU_v6

jobs:
  compilar-jrxml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar existencia del archivo .jrxml antes de subirlo
        run: ls -lah "${{ github.event.inputs.file }}.jrxml" || echo "Archivo no encontrado"

      - name: Subir archivo .jrxml como artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.file }}.jrxml"
          path: "${{ github.event.inputs.file }}.jrxml"

      - name: Construir imagen Docker
        run: docker build --platform linux/amd64 -t java6-image-test .

      - name: Verificar contenido de JasperReports en el contenedor
        run: docker run --rm java6-image-test ls -lah /app

      - name: Verificar contenido de JasperReports en el contenedor 2 
        run: docker run --rm java6-image-test ls -lah /app/jasperreports-5.6.0
    
      - name: Verificar contenido de JasperReports en el contenedor 3
        run: docker run --rm java6-image-test ls -lah /app/jasperreports-5.6.0/dist

      - name: Ejecutar contenedor y compilar el archivo .jrxml
        run: |
          docker run --rm \
            -v $(pwd)/volumen:/app \
            java6-image-test bash -c "
            echo 'deb http://archive.debian.org/debian wheezy main' > /etc/apt/sources.list &&
            echo 'deb http://archive.debian.org/debian-security wheezy/updates main' >> /etc/apt/sources.list &&
            echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid-until &&
            apt-get update &&
            
            # Verificar si JasperReports se copió
            ls -lah /app/ &&
            ls -lah /app/jasperreports-5.6.0/ &&
      
            # Configurar CLASSPATH correctamente con `dist/`
            export CLASSPATH=$(find /app/jasperreports-5.6.0/dist/ -name '*.jar' | tr '\n' ':') &&
            echo \"CLASSPATH: $CLASSPATH\" &&
      
            echo 'import net.sf.jasperreports.engine.*;
            public class CompileReport {
                public static void main(String[] args) {
                    if (args.length < 1) {
                        System.out.println(\"Uso: java CompileReport <archivo.jrxml>\");
                        return;
                    }
                    try {
                        JasperCompileManager.compileReportToFile(args[0]);
                        System.out.println(\"Archivo compilado: \" + args[0].replace(\".jrxml\", \".jasper\"));
                    } catch (JRException e) {
                        e.printStackTrace();
                    }
                }
            }' > CompileReport.java &&
      
            # Compilar y ejecutar
            javac -cp \"$CLASSPATH\" CompileReport.java &&
            java -cp \"$CLASSPATH:/app\" CompileReport /app/${{ github.event.inputs.file }}.jrxml
          "
      
      
      

    #   - name: Verificar si el archivo .jasper se generó
    #     run: ls -lah volumen/

