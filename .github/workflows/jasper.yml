name: Compile Jrxml to Jasper

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Archivo .jrxml a compilar'
        required: true
        type: string
        default: CONTRATO_GNRAL_FMU_v6

jobs:
  compile-jasper:
    runs-on: ubuntu-latest  # Usa una VM en GitHub Actions

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🛠 Descargar e instalar Java 6 desde BIN
        run: |
          echo "Descargando JDK 6..."
          curl -L -o jdk-6u45-linux-x64.bin https://github.com/sacm1046/jasper/releases/download/v6/jdk-6u45-linux-x64.bin

          echo "Haciendo ejecutable el instalador..."
          chmod +x jdk-6u45-linux-x64.bin

          echo "Ejecutando el instalador en un directorio temporal..."
          mkdir -p /tmp/java6
          mv jdk-6u45-linux-x64.bin /tmp/java6/
          cd /tmp/java6
          ./jdk-6u45-linux-x64.bin -noregister > /dev/null

          echo "Verificando instalación..."
          ls -l /tmp/java6

          echo "Moviendo JDK 6 a /opt/java6..."
          sudo mv /tmp/java6/jdk1.6.0_45 /opt/java6

          echo "Configurando Java 6 en el entorno..."
          echo "JAVA_HOME=/opt/java6" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

          echo "Verificando instalación de Java 6..."
          /opt/java6/bin/java -version

      - name: 📂 Crear estructura de directorios
        run: mkdir -p compiled_reports lib

      - name: 📥 Descargar JasperReports 5.6.0 desde GitHub Releases
        run: |
          echo "Descargando JasperReports 5.6.0..."
          curl -L -o jasperreports-5.6.0.zip https://github.com/sacm1046/jasper/releases/download/v5.6.0/jasperreports-5.6.0-project.zip
          
          echo "Extrayendo JasperReports..."
          unzip jasperreports-5.6.0.zip -d lib/
          
          echo "Buscando el .jar de JasperReports..."
          find lib/ -name "jasperreports-5.6.0.jar" -exec mv {} lib/ \;

          echo "Limpiando archivos innecesarios..."
          rm -rf lib/jasperreports-5.6.0/

      - name: 📜 Compilar .jrxml a .jasper
        run: |
          echo "Compilando archivos JRXML..."
          echo 'import net.sf.jasperreports.engine.*;' > CompileReport.java
          echo 'import java.io.*;' >> CompileReport.java
          echo 'public class CompileReport {' >> CompileReport.java
          echo '  public static void main(String[] args) throws JRException {' >> CompileReport.java
          echo '    String sourceFile = args[0];' >> CompileReport.java
          echo '    String outputFile = sourceFile.replace(".jrxml", ".jasper");' >> CompileReport.java
          echo '    JasperCompileManager.compileReportToFile(sourceFile, outputFile);' >> CompileReport.java
          echo '    System.out.println("Compilado: " + outputFile);' >> CompileReport.java
          echo '  }' >> CompileReport.java
          echo '}' >> CompileReport.java

          javac -cp lib/jasperreports-5.6.0.jar CompileReport.java
          for file in reports/*.jrxml; do
            java -cp .:lib/jasperreports-5.6.0.jar CompileReport "$file"
            mv "${file%.jrxml}.jasper" compiled_reports/
          done

      - name: 📤 Subir archivos compilados como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: compiled-reports
          path: compiled_reports/*.jasper
