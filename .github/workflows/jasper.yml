name: Compile Jrxml to Jasper

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Archivo .jrxml a compilar'
        required: true
        type: string
        default: CONTRATO_GNRAL_FMU_v6

jobs:
  compile-jasper:
    runs-on: ubuntu-latest
    container:
      image: openjdk:6-jdk

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 📂 Crear estructura de directorios
        run: mkdir -p compiled_reports lib

      - name: 📥 Descargar JasperReports 5.6.0 desde GitHub Releases
        run: |
          curl -L -o jasperreports-5.6.0.zip \
          https://github.com/sacm1046/jasper/releases/download/v5.6.0/jasperreports-5.6.0-project.zip
          unzip jasperreports-5.6.0.zip -d lib/
          mv lib/jasperreports-5.6.0/lib/jasperreports-5.6.0.jar lib/
          rm -rf lib/jasperreports-5.6.0/

      - name: 📜 Compilar .jrxml a .jasper
        run: |
          echo "Compilando archivos JRXML..."
          echo 'import net.sf.jasperreports.engine.*;' > CompileReport.java
          echo 'import java.io.*;' >> CompileReport.java
          echo 'public class CompileReport {' >> CompileReport.java
          echo '  public static void main(String[] args) throws JRException {' >> CompileReport.java
          echo '    String sourceFile = args[0];' >> CompileReport.java
          echo '    String outputFile = sourceFile.replace(".jrxml", ".jasper");' >> CompileReport.java
          echo '    JasperCompileManager.compileReportToFile(sourceFile, outputFile);' >> CompileReport.java
          echo '    System.out.println("Compilado: " + outputFile);' >> CompileReport.java
          echo '  }' >> CompileReport.java
          echo '}' >> CompileReport.java

          javac -cp lib/jasperreports-5.6.0.jar CompileReport.java
          for file in reports/*.jrxml; do
            java -cp .:lib/jasperreports-5.6.0.jar CompileReport "$file"
            mv "${file%.jrxml}.jasper" compiled_reports/
          done

      - name: 📤 Subir archivos compilados como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: compiled-reports
          path: compiled_reports/*.jasper
