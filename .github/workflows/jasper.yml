name: Jasper Workflow

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Archivo .jrxml a compilar'
        required: true
        type: string
        default: CONTRATO_GNRAL_FMU_v6

jobs:
  compilar-jrxml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar existencia del archivo .jrxml antes de subirlo
        run: ls -lah "${{ github.event.inputs.file }}.jrxml" || echo "Archivo no encontrado"

      - name: Subir archivo .jrxml como artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.file }}.jrxml"
          path: "${{ github.event.inputs.file }}.jrxml"

      - name: Construir imagen Docker
        run: docker build --platform linux/amd64 -t java6-image-test .

      - name: Verificar si `jasperreports-5.6.0-project.zip` está en el contexto
        run: ls -lah jasperreports-5.6.0-project.zip

      - name: Compilar .jrxml a .jasper
        run: |
          docker run --rm java6-image-test bash -c "
            echo 'deb http://archive.debian.org/debian wheezy main' > /etc/apt/sources.list &&
            echo 'deb http://archive.debian.org/debian-security wheezy/updates main' >> /etc/apt/sources.list &&
            echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid-until &&
            apt-get update &&
            apt-get install -y unzip &&
            
            # Verificar que el archivo ZIP realmente existe antes de descomprimir
            if [ ! -f /app/jasperreports-5.6.0-project.zip ]; then
              echo '⚠️ ERROR: /app/jasperreports-5.6.0-project.zip NO existe en el contenedor'
              ls -lah /app/
              exit 1
            fi
      
            # Extraer archivos
            unzip /app/jasperreports-5.6.0-project.zip -d /app/
      
            # Verificar que `dist/` realmente se extrajo
            if [ ! -d /app/jasperreports-5.6.0/dist/ ]; then
              echo '⚠️ ERROR: No se encontró la carpeta /app/jasperreports-5.6.0/dist/'
              ls -lah /app/jasperreports-5.6.0/
              exit 1
            fi
      
            export CLASSPATH=$(find /app/jasperreports-5.6.0/dist/ -name '*.jar' | tr '\n' ':')
            
            javac -cp \"$CLASSPATH\" CompileReport.java &&
            java -cp \"$CLASSPATH:/app\" CompileReport /app/${{ github.event.inputs.file }}.jrxml
          "
      
